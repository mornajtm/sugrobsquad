<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Профиль — SUGROB SQUAD</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="side-menu-overlay" id="sideMenuOverlay"></div>
  <aside class="side-menu" id="sideMenu">
    <div class="side-menu-head">
      <span>Меню</span>
      <button id="closeSideMenu">✕</button>
    </div>
    <nav class="side-menu-nav">
      <a href="/"><i data-lucide="home"></i> Главная</a>
      <a href="/profile"><i data-lucide="user"></i> Профиль</a>
      <a href="/trade"><i data-lucide="shopping-bag"></i> Торговля</a>
      <a href="/realty"><i data-lucide="store"></i> Недвижимость</a>
    </nav>
  </aside>

  <header class="topbar">
    <button class="burger"><i data-lucide="menu"></i></button>
    <a href="/" class="logo">SUGROB SQUAD</a>
    <div class="topbar-right">
      <button class="icon-btn" id="openNotifications" title="Уведомления">
        <i data-lucide="bell"></i>
        <span class="notif-badge" id="notifBadge" style="display:none">0</span>
      </button>
      <a href="/profile" class="user-chip">
        <span class="user-chip-avatar">
          <i data-lucide="user"></i>
        </span>
      </a>
    </div>
  </header>

  <main class="container narrow">
    <div class="card" id="profileCard">
      <p class="muted">Загрузка...</p>
    </div>
  </main>

  <script src="/static/script.js"></script>
</body>
</html>
