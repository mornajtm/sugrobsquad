<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация — SUGROB SQUAD</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="container narrow">
    <form class="card form" id="registerForm">
      <h1>Регистрация</h1>
      <p class="err" id="error"></p>
      <input type="text" name="username" placeholder="Ник" required>
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Пароль (мин. 6 символов)" required>
      <button type="submit" class="btn primary">Создать аккаунт</button>
      <p class="muted">Уже есть аккаунт? <a href="/login">Войти</a></p>
    </form>
  </main>
  <script src="/static/script.js"></script>
</body>
</html>
